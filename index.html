<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Penggunaan Makmal Komputer</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Font (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

  <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
    
    <!-- Header Borang -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 text-white text-center relative">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-white/10 rounded-full mb-3 backdrop-blur-sm">
        <i class="fa-solid fa-desktop text-2xl text-white"></i>
      </div>
      <h2 class="text-2xl font-bold tracking-wide">Makmal Komputer</h2>
      <p class="text-blue-100 text-xs sm:text-sm mt-1">Borang Rekod Daftar Masuk & Keluar Guru</p>
    </div>

    <!-- Isian Borang -->
    <form id="labForm" class="p-6 space-y-4">
      
      <!-- Nama Guru -->
      <div>
        <label for="namaGuru" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
          <i class="fa-solid fa-user-tie text-blue-500 mr-1.5"></i>Nama Guru
        </label>
        <input type="text" id="namaGuru" required placeholder="Contoh: Cikgu Ahmad" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm text-slate-800 transition placeholder-slate-400">
      </div>

      <!-- Kelas / Tujuan -->
      <div>
        <label for="tujuan" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
          <i class="fa-solid fa-book-open text-blue-500 mr-1.5"></i>Kelas / Tujuan
        </label>
        <input type="text" id="tujuan" required placeholder="Contoh: 4 Bestari / PdP RBT" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm text-slate-800 transition placeholder-slate-400">
      </div>

      <!-- Bilangan Murid -->
      <div>
        <label for="bilMurid" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
          <i class="fa-solid fa-users text-blue-500 mr-1.5"></i>Bilangan Murid
        </label>
        <input type="number" id="bilMurid" required placeholder="Contoh: 30" min="1" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm text-slate-800 transition placeholder-slate-400">
      </div>

      <!-- Masa (Bahagian Grid 2 Lajur) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Masa Masuk -->
        <div>
          <label for="masaMasuk" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-right-to-bracket text-emerald-500 mr-1.5"></i>Masa Masuk
          </label>
          <select id="masaMasuk" required 
            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm text-slate-800 transition bg-white">
            <option value="">-- Pilih Masa --</option>
            <option value="07:00 AM">07:00 AM</option>
            <option value="07:30 AM">07:30 AM</option>
            <option value="08:00 AM">08:00 AM</option>
            <option value="08:30 AM">08:30 AM</option>
            <option value="09:00 AM">09:00 AM</option>
            <option value="09:30 AM">09:30 AM</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="10:30 AM">10:30 AM</option>
            <option value="11:00 AM">11:00 AM</option>
            <option value="11:30 AM">11:30 AM</option>
            <option value="12:00 PM">12:00 PM</option>
            <option value="12:30 PM">12:30 PM</option>
            <option value="01:00 PM">01:00 PM</option>
            <option value="01:30 PM">01:30 PM</option>
            <option value="02:00 PM">02:00 PM</option>
            <option value="02:30 PM">02:30 PM</option>
            <option value="03:00 PM">03:00 PM</option>
            <option value="03:30 PM">03:30 PM</option>
            <option value="04:00 PM">04:00 PM</option>
            <option value="04:30 PM">04:30 PM</option>
            <option value="05:00 PM">05:00 PM</option>
            <option value="05:30 PM">05:30 PM</option>
            <option value="06:00 PM">06:00 PM</option>
          </select>
        </div>

        <!-- Masa Keluar -->
        <div>
          <label for="masaKeluar" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
            <i class="fa-solid fa-right-from-bracket text-rose-500 mr-1.5"></i>Masa Keluar
          </label>
          <select id="masaKeluar" required 
            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm text-slate-800 transition bg-white">
            <option value="">-- Pilih Masa --</option>
            <option value="07:30 AM">07:30 AM</option>
            <option value="08:00 AM">08:00 AM</option>
            <option value="08:30 AM">08:30 AM</option>
            <option value="09:00 AM">09:00 AM</option>
            <option value="09:30 AM">09:30 AM</option>
            <option value="10:00 AM">10:00 AM</option>
            <option value="10:30 AM">10:30 AM</option>
            <option value="11:00 AM">11:00 AM</option>
            <option value="11:30 AM">11:30 AM</option>
            <option value="12:00 PM">12:00 PM</option>
            <option value="12:30 PM">12:30 PM</option>
            <option value="01:00 PM">01:00 PM</option>
            <option value="01:30 PM">01:30 PM</option>
            <option value="02:00 PM">02:00 PM</option>
            <option value="02:30 PM">02:30 PM</option>
            <option value="03:00 PM">03:00 PM</option>
            <option value="03:30 PM">03:30 PM</option>
            <option value="04:00 PM">04:00 PM</option>
            <option value="04:30 PM">04:30 PM</option>
            <option value="05:00 PM">05:00 PM</option>
            <option value="05:30 PM">05:30 PM</option>
            <option value="06:00 PM">06:00 PM</option>
          </select>
        </div>
      </div>

      <!-- Catatan / Kerosakan -->
      <div>
        <label for="catatan" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">
          <i class="fa-solid fa-triangle-exclamation text-amber-500 mr-1.5"></i>Catatan / Kerosakan (Pilihan)
        </label>
        <textarea id="catatan" rows="2" placeholder="Contoh: PC 05 tiada liputan internet" 
          class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm text-slate-800 transition placeholder-slate-400"></textarea>
      </div>

      <!-- Butang Hantar -->
      <button type="submit" id="submitBtn" 
        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition duration-200 flex items-center justify-center gap-2 text-sm sm:text-base mt-2">
        <i class="fa-solid fa-paper-plane"></i> Hantar Rekod
      </button>
    </form>

    <!-- Paparan Status Hantaran -->
    <div id="status" class="px-6 pb-6 text-center text-sm font-medium hidden"></div>

  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxea9hnki7hZNOJNYvoTo_FLmX5V-lREjP_V_q_M83iChheJT5W1PN_pn5cBp7bb_3M_w/exec";

  document.getElementById('labForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Menghantar data...`;
    
    statusDiv.classList.remove('hidden', 'text-emerald-600', 'text-rose-600');
    statusDiv.classList.add('text-blue-600');
    statusDiv.innerText = "Sila tunggu, sedang memproses...";

    const payload = {
      namaGuru: document.getElementById('namaGuru').value,
      tujuan: document.getElementById('tujuan').value,
      bilMurid: document.getElementById('bilMurid').value,
      masaMasuk: document.getElementById('masaMasuk').value,
      masaKeluar: document.getElementById('masaKeluar').value,
      catatan: document.getElementById('catatan').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusDiv.classList.remove('text-blue-600');
      statusDiv.classList.add('text-emerald-600');
      statusDiv.innerHTML = `<i class="fa-solid fa-circle-check mr-1"></i> Rekod berjaya didaftarkan!`;
      
      document.getElementById('labForm').reset();
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Hantar Rekod`;
    })
    .catch(error => {
      statusDiv.classList.remove('text-blue-600');
      statusDiv.classList.add('text-rose-600');
      statusDiv.innerHTML = `<i class="fa-solid fa-circle-xmark mr-1"></i> Ralat semasa menghantar data.`;
      
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Hantar Rekod`;
    });
  });
</script>

</body>
</html>
