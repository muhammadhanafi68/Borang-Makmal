<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Penggunaan Makmal Komputer</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #eef2f5; 
      padding: 20px; 
      margin: 0;
    }
    .container { 
      max-width: 500px; 
      margin: auto; 
      background: #ffffff; 
      padding: 25px 30px; 
      border-radius: 12px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
    }
    h2 { 
      text-align: center; 
      color: #1a252f; 
      margin-bottom: 20px;
    }
    label { 
      font-weight: 600; 
      margin-top: 15px; 
      display: block; 
      color: #34495e;
      font-size: 14px;
    }
    input, select, textarea, button { 
      width: 100%; 
      padding: 12px; 
      margin-top: 6px; 
      border: 1px solid #cccccc; 
      border-radius: 6px; 
      box-sizing: border-box; 
      font-size: 14px;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #3498db;
      outline: none;
    }
    button { 
      background-color: #27ae60; 
      color: white; 
      border: none; 
      font-size: 16px; 
      font-weight: bold; 
      margin-top: 25px; 
      cursor: pointer; 
      transition: background 0.2s ease;
    }
    button:hover { 
      background-color: #219150; 
    }
    .status { 
      margin-top: 15px; 
      text-align: center; 
      font-weight: bold; 
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Daftar Masuk Makmal Komputer</h2>
  <form id="labForm">
    <label for="namaGuru">Nama Guru:</label>
    <input type="text" id="namaGuru" required placeholder="Contoh: Cikgu Ahmad">

    <label for="tujuan">Kelas / Tujuan:</label>
    <input type="text" id="tujuan" required placeholder="Contoh: 4 Bestari / PdP RBT">

    <label for="bilMurid">Bilangan Murid:</label>
    <input type="number" id="bilMurid" required placeholder="Contoh: 30" min="1">

    <label for="masaMasuk">Masa Masuk:</label>
    <select id="masaMasuk" required>
      <option value="">-- Pilih Masa Masuk --</option>
      <option value="07:00 AM">07:00 AM</option>
      <option value="07:30 AM">07:30 AM</option>
      <option value="08:00 AM">08:00 AM</option>
      <option value="08:30 AM">08:30 AM</option>
      <option value="09:00 AM">09:00 AM</option>
      <option value="09:30 AM">09:30 AM</option>
      <option value="10:00 AM">10:00 AM</option>
      <option value="10:30 AM">10:30 AM</option>
      <option value="11:00 AM">11:00 AM</option>
      <option value="11:30 AM">11:30 AM</option>
      <option value="12:00 PM">12:00 PM</option>
      <option value="12:30 PM">12:30 PM</option>
      <option value="01:00 PM">01:00 PM</option>
      <option value="01:30 PM">01:30 PM</option>
      <option value="02:00 PM">02:00 PM</option>
      <option value="02:30 PM">02:30 PM</option>
      <option value="03:00 PM">03:00 PM</option>
      <option value="03:30 PM">03:30 PM</option>
      <option value="04:00 PM">04:00 PM</option>
      <option value="04:30 PM">04:30 PM</option>
      <option value="05:00 PM">05:00 PM</option>
      <option value="05:30 PM">05:30 PM</option>
      <option value="06:00 PM">06:00 PM</option>
    </select>

    <label for="masaKeluar">Masa Keluar (Anggaran):</label>
    <select id="masaKeluar" required>
      <option value="">-- Pilih Masa Keluar --</option>
      <option value="07:30 AM">07:30 AM</option>
      <option value="08:00 AM">08:00 AM</option>
      <option value="08:30 AM">08:30 AM</option>
      <option value="09:00 AM">09:00 AM</option>
      <option value="09:30 AM">09:30 AM</option>
      <option value="10:00 AM">10:00 AM</option>
      <option value="10:30 AM">10:30 AM</option>
      <option value="11:00 AM">11:00 AM</option>
      <option value="11:30 AM">11:30 AM</option>
      <option value="12:00 PM">12:00 PM</option>
      <option value="12:30 PM">12:30 PM</option>
      <option value="01:00 PM">01:00 PM</option>
      <option value="01:30 PM">01:30 PM</option>
      <option value="02:00 PM">02:00 PM</option>
      <option value="02:30 PM">02:30 PM</option>
      <option value="03:00 PM">03:00 PM</option>
      <option value="03:30 PM">03:30 PM</option>
      <option value="04:00 PM">04:00 PM</option>
      <option value="04:30 PM">04:30 PM</option>
      <option value="05:00 PM">05:00 PM</option>
      <option value="05:30 PM">05:30 PM</option>
      <option value="06:00 PM">06:00 PM</option>
    </select>

    <label for="catatan">Catatan / Kerosakan (Jika ada):</label>
    <textarea id="catatan" rows="3" placeholder="Contoh: PC 05 tiada liputan internet"></textarea>

    <button type="submit" id="submitBtn">Hantar Rekod</button>
  </form>
  <div id="status" class="status"></div>
</div>

<script>
  // URL Apps Script yang telah dimasukkan:
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxea9hnki7hZNOJNYvoTo_FLmX5V-lREjP_V_q_M83iChheJT5W1PN_pn5cBp7bb_3M_w/exec";

  document.getElementById('labForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const btn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');
    btn.disabled = true;
    statusDiv.style.color = "#2980b9";
    statusDiv.innerText = "Menghantar data...";

    const payload = {
      namaGuru: document.getElementById('namaGuru').value,
      tujuan: document.getElementById('tujuan').value,
      bilMurid: document.getElementById('bilMurid').value,
      masaMasuk: document.getElementById('masaMasuk').value,
      masaKeluar: document.getElementById('masaKeluar').value,
      catatan: document.getElementById('catatan').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusDiv.style.color = "#27ae60";
      statusDiv.innerText = "Berjaya didaftarkan!";
      document.getElementById('labForm').reset();
      btn.disabled = false;
    })
    .catch(error => {
      statusDiv.style.color = "#c0392b";
      statusDiv.innerText = "Ralat semasa menghantar data.";
      btn.disabled = false;
    });
  });
</script>

</body>
</html>
